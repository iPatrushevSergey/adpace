server:
  address: "127.0.0.1:8080"
  shutdown_timeout: "10s"
  cert_file: ""
  key_file: ""

logger:
  level: info
  format: json

db_pool:
  uri: ""
  max_conns: 25
  min_conns: 5
  max_conn_life: "1h"
  max_conn_idle: "30m"
  health_check: "1m"

db_retry:
  max_retries: 3
  base_delay: "100ms"
  max_delay: "2s"
